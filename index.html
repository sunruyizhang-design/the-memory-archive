const postSeeds={en:{photo:[['rain','The rain on our kitchen window sounded exactly like the summers at home. I can still picture the mug beside it.','A. · Shared anonymously'],['coast','We went to the sea without taking a single photo. Somehow that is the day I remember most clearly.','M. · Shared anonymously'],['window','Every evening my father opened the window before making tea. I didn’t know I would miss that small sound.','J. · Shared anonymously'],['garden','A question I keep returning to: if a memory changes each time we tell it, which version belongs in an archive?','R. · Shared anonymously']],text:[['I would want an AI to remember the stories I chose to leave, not to guess at the parts I kept private.','A boundary I would want respected.'],['Do you think a voice replica comforts the person who is grieving, or the person who made it?','Still thinking about this.'],['My grandmother’s recipes were never written down. I remember the smell more than the measurements.','A memory in the body.'],['If an archive can answer in someone’s voice, should it also be able to say “I don’t know”?','A question for the discussion.'],['Who should be allowed to make a digital version of someone who has died?','An open question.'],['Can a digital voice be comforting and unsettling at the same time?','I think it can.'],['Which memories should never be reconstructed by AI?','A question about boundaries.'],['If the archive gets a memory wrong, who should be able to correct it?','Who owns the correction?'],['Would you want your family to keep your messages forever?','I am not sure.'],['Could an AI archive help someone grieve without pretending to be the person they lost?','A question worth discussing.']]},zh:{photo:[['rain','厨房窗边的雨声，和小时候夏天一模一样。我还记得旁边那只杯子。','匿名访客 A'],['coast','那次去海边，我们一张照片都没拍。不知为什么，那天反而记得最清楚。','匿名访客 M'],['window','父亲每天傍晚都会先打开窗再泡茶。我没想到自己会想念那个小小的声音。','匿名访客 J'],['garden','我总在想：如果每次讲述都会改变一段记忆，档案里该保存哪一个版本？','匿名访客 R']],text:[['我希望 AI 记住的是我主动留下的故事，而不是猜测那些我选择保留隐私的部分。','我希望被尊 const articleBlurbs={en:[
['A qualitative study of how people understand AI-generated agents as a form of digital legacy, including hopes, concerns, and design expectations.','Focus groups explore whether privacy expectations and social boundaries should continue after death.','Connects digital and physical objects to the ways people construct biographies and memorials after death.','Uses data projections to ask how social platforms may become populated by deceased users and what that means for online life.','Survey research links death-related information practices with digital remembrance, posthumous data, and openness to AI-supported bereavement.'],
['Presents a method for grouping digital traces into episodes and examines whether those reconstructions can support recall.','Tests two approaches for reducing rich false memories after they have formed.','Finds that people with exceptionally strong autobiographical memory can still be susceptible to false recognition and misinformation.','Reviews research methods for suggesting false childhood memories and explains why belief, recollection, and confidence need to be distinguished.','Investigates popular assumptions about memory, including whether people really treat it as a video camera.'],
['Asks whether conversations with a thanabot can preserve a relationship, and distinguishes continuing bonds from literal continuation.','Examines deathbots as part of the emotional and social infrastructures through which people remember.','Maps ethical risks and proposes responsible design practices for generative recreations of deceased people.','Studies how thanabots shape mourning, fantasy, emotional attachment, and users’ reflections on loss.','Analyzes expressions of bereavement and distress on deceased people’s social media profiles.'],
['Turns ethical principles for AI afterlives into design constraints covering consent, disclosure, purpose, access, and governance.','Examines post-mortem privacy in health-data research and the ethical reasons for protecting deceased people’s information.','Analyzes privacy, data protection, and legal questions raised by memorial chatbots.','Proposes an ethical framework for organizations that preserve or commercialize digital remains.','Sets out consent and non-addiction safeguards for AI grief bots, including warnings and protection against unhealthy dependency.']],zh:[
['质性研究人们如何看待 AI 生成的数字化身作为数字遗产，并整理相关期待、担忧与设计要求。','通过焦点小组讨论隐私期待与社交边界是否应在死亡之后继续受到尊重。','连接数字与实体物件，探讨人们如何在逝后构建个人传记与纪念方式。','通过数据预测追问社交平台可能如何被逝者账号占据，以及这对网络生活意味着什么。','基于问卷研究死亡相关信息实践、数字纪念、逝后数据，以及人们对 AI 哀伤支持的态度。'],

function openCommunityDb(){if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB unavailable'));if(communityDbPromise)return communityDbPromise;communityDbPromise=new Promise((resolve,reject)=>{const request=indexedDB.open('the-memory-archive-community',1);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains('posts'))db.createObjectStore('posts',{keyPath:'id'})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('Could not open archive storage'))});return communityDbPromise}
async function loadCommunityPosts(){try{const db=await openCommunityDb();const rows=await new Promise((resolve,reject)=>{const request=db.transaction('posts','readonly').objectStore('posts').getAll();request.onsuccess=()=>resolve(request.result||[]);request.onerror=()=>reject(request.error)});state.thoughts=rows.sort((a,b)=>b.time-a.time);if(state.screen==='thought')render()}catch(error){console.warn('Community storage is unavailable',error)}}
async function saveCommunityPost(post){const db=await openCommunityDb();await new Promise((resolve,reject)=>{const tx=db.transaction('posts','readwrite');tx.objectStore('posts').put(post);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Could not save post'));tx.onabort=()=>reject(tx.error||new Error('Saving was cancelled'))})}
function localEngagement(){try{return JSON.parse(localStorage.getItem('memory-archive-engagement')||'{}')}catch(e){return {}}}

function seededEngagement(id){const match=/^seed-(post|question)-(\d+)$/.exec(id);if(!match)return {likes:0,comments:[]};const index=(match[1]==='post'?0:4)+Number(match[2]),seed=demoEngagement[index];if(!seed)return {likes:0,comments:[]};const now=Date.now(),language=locale==='en'?0:1,reply=demoReplyLines[locale],count=index+1,comments=Array.from({length:count},(_,j)=>{const base=seed.comments[j%seed.comments.length][language],text=j<seed.comments.length?base:`${reply[(index+j)%reply.length]} ${base}`;return {text,author:locale==='en'?`Anonymous visitor ${String.fromCharCode(65+(index+j)%26)}`:`匿名访客 ${String.fromCharCode(65+(index+j)%26)}`,time:now-(index*4+j+1)*3600000}});return {likes:seed.likes,comments}}
function engagementFor(id){const data=localEngagement(),demo=seededEngagement(id),liked=!!(data.likes&&data.likes[id]),comments=[...demo.comments,...(data.comments&&data.comments[id]||[])];return {liked,likes:demo.likes+(liked?1:0),comments,commentCount:comments.length}}
function seedArchivePosts(category){const seeds=postSeeds[locale];if(category==='post')return seeds.photo.map((row,i)=>({id:'seed-post-'+i,category:'post',visual:row[0],text:row[1],author:row[2],time:Date.now()-i*86400000,attachments:[]}));return seeds.text.map((row,i)=>({id:'seed-question-'+i,category:'question',title:row[1],text:row[0],author:locale==='en'?'Anonymous visitor':'匿名访客',time:Date.now()-i*72000000,attachments:[]}))}
function allArchivePosts(category){return [...state.thoughts.filter(p=>p.category===category),...seedArchivePosts(category)]}
function findArchivePost(id){return [...allArchivePosts('post'),...allArchivePosts('question')].find(p=>p.id===id)}
function attachmentURL(file){if(file.blob instanceof Blob){const url=URL.createObjectURL(file.blob);communityObjectURLs.push(url);return url}return ''}
function renderAttachmentList(post,detail=false){return (post.attachments||[]).map(file=>{const url=attachmentURL(file),image=file.type&&file.type.startsWith('image/');if(image)return detail?`<figure class="detail-attachment"><img src="${url}" alt="${esc(file.name)}"><figcaption>${esc(file.name)}</figcaption></figure>`:`<img class="community-thumb" src="${url}" alt="${esc(file.name)}">`;return `<a class="community-file" href="${url}" download="${esc(file.name)}"><span aria-hidden="true">▤</span><span>${esc(file.name)}<small>${locale==='en'?'Download attachment':'下载附件'} · ${Math.max(1,Math.round((file.size||0)/1024))} KB</small></span></a>`}).join('')}
function communityCard(post){const engagement=engagementFor(post.id),date=new Date(post.time||Date.now()).toLocaleDateString(locale==='en'?'en':'zh-CN',{year:'numeric',month:'short',day:'numeric'}),label=post.category==='post'?t('postsTitle'):t('questionsTitle');return `<article class="community-card">${post.visual?`<div class="memory-photo ${esc(post.visual)}" role="img" aria-label="${locale==='en'?'Memory illustration':'记忆插画'}"><span class="scene-label">${locale==='en'?'MEMORY FRAGMENT':'记忆片段'}</span></div>`:''}<button class="community-open" data-open-post="${esc(post.id)}"><span class="community-type">${label}</span>${post.title?`<strong class="community-title">${esc(post.title)}</strong>`:''}<p>${esc(post.text)}</p><span class="community-author">${esc(post.author)} · ${date}</span></button>${post.attachments&&post.attachments.length?`<div class="community-attachments">${renderAttachmentList(post)}</div>`:''}<div class="community-actions"><button type="button" data-like="${esc(post.id)}" aria-pressed="${engagement.liked}">${engagement.liked?'♥':'♡'} ${locale==='en'?'Like':'点赞'} · ${engagement.likes}</button><button type="button" data-open-post="${esc(post.id)}">▤ ${locale==='en'?'Comments':'评论'} · ${engagement.commentCount}</button></div></article>`}
function archiveDetail(post){if(!post)return '';const engagement=engagementFor(post.id),comments=engagement.comments.map(c=>`<article class="archive-comment"><p>${esc(c.text)}</p><small>${esc(c.author)} · ${new Date(c.time).toLocaleString(locale==='en'?'en':'zh-CN')}</small></article>`).join('');return `<div class="detail-backdrop" data-detail-backdrop><section class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><button type="button" class="detail-close" data-action="close-post" aria-label="${locale==='en'?'Close':'关闭'}">×</button><span class="community-type">${post.category==='post'?t('postsTitle'):t('questionsTitle')}</span><h2 id="detailTitle">${esc(post.title||post.text.slice(0,72))}</h2><p class="detail-text">${esc(post.text)}</p><p class="community-author">${esc(post.author)}</p>${post.visual?`<div class="memory-photo detail-memory ${esc(post.visual)}"><span class="scene-label">${locale==='en'?'MEMORY FRAGMENT':'记忆片段'}</span></div>`:''}<div class="detail-attachments">${renderAttachmentList(post,true)}</div><div class="detail-actions"><button type="button" data-like="${esc(post.id)}" aria-pressed="${engagement.liked}">${engagement.liked?'♥':'♡'} ${locale==='en'?'Like':'点赞'} · ${engagement.likes}</button><span>${engagement.commentCount} ${locale==='en'?'comments':'条评论'}</span></div><h3>${locale==='en'?'Comments':'评论'}</h3><div class="comment-list">${comments||`<p class="empty-comments">${locale==='en'?'No comments yet. Start the conversation.':'还没有评论，来写下第一条吧。'}</p>`}</div><form class="comment-form" data-comment-form="${esc(post.id)}"><label for="commentText">${locale==='en'?'Add a comment':'添加评论'}</label><textarea id="commentText" required maxlength="1000" placeholder="${locale==='en'?'Write a thoughtful reply…':'写下你的回应……'}"></textarea><button type="submit" class="btn dark">${locale==='en'?'Publish comment':'发布评论'}</button></form></section></div>`}
function thought(){communityObjectURLs.forEach(URL.revokeObjectURL);communityObjectURLs.length=0;const posts=allArchivePosts('post'),questions=allArchivePosts('question'),active=state.activePost?findArchivePost(state.activePost):null;return `<section class="screen">${head(t('leaveThought'),t('thoughtTitle'),t('thoughtLead'))}<div class="archive-columns"><section class="archive-column"><h2>${t('postsTitle')} <small>${posts.length}</small></h2><div class="archive-scroll" tabindex="0" role="region" aria-label="${t('postsTitle')}">${posts.map(communityCard).join('')}</div></section><section class="archive-column"><h2>${t('questionsTitle')} <small>${questions.length}</small></h2><div class="archive-scroll" tabindex="0" role="region" aria-label="${t('questionsTitle')}">${questions.map(communityCard).join('')}</div></section></div><div class="upload-entry"><button type="button" class="upload-trigger" data-action="upload-form" aria-label="${locale==='en'?'Open upload form':'打开上传表单'}"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 39V9m-11 12 11-12 11 12M14 34v13h36V34" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="choices" style="justify-content:center">${btn(locale==='en'?'Continue':'继续','end','btn dark')}</div>${archiveDetail(active)}</section>`}
